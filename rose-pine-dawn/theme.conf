# vim: ft=dosini
# Generated by scripts/generate.py from the Rosé Pine Squirrel schemes.
[Metadata]
Name=Rosé-Pine-Dawn
Version=2
Author=scotabroad
Description=All natural pine, faux fur and a bit of soho vibes for the classy minimalist
ScaleWithDPI=True

[InputPanel]
Font=Sans 13
# Candidate text and preedit text
NormalColor=#58527cd8
# Selected candidate text
HighlightCandidateColor=#c15e7ad8
# Highlighted preedit text
HighlightColor=#58527cd8
# Highlighted preedit background
HighlightBackgroundColor=#fffaf2
CandidateLabelColor=#9993a7d8
HighlightCandidateLabelColor=#9993a7d9
CandidateCommentColor=#9993a7d8
HighlightCandidateCommentColor=#9993a7da

[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

# Space around each candidate. The highlight margin must not exceed this, or
# the highlight overlaps the next candidate.
[InputPanel/TextMargin]
Left=6
Right=6
Top=4
Bottom=4

[InputPanel/Background]
Color=#fffaf2

[InputPanel/Highlight]
Color=#f4e9e0

# Extends the highlight past the candidate text
[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
Font=Sans 10
NormalColor=#58527cd8
HighlightCandidateColor=#c15e7ad8
Spacing=3

[Menu/Background]
Color=#fffaf2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#f4e9e0

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
Color=#9993a7d8

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
