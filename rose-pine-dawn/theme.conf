# vim: ft=dosini
# Colors are matched to the Rosé Pine Squirrel schemes. Squirrel uses Display
# P3, so the values here are converted to sRGB for fcitx5.
[Metadata]
Name=Rosé-Pine-Dawn
Version=1
Author=scotabroad
Description=All natural pine, faux fur and a bit of soho vibes for the classy minimalist
ScaleWithDPI=True

[InputPanel]
# Typeface
Font=Sans 13
# Candidate character color
NormalColor=#805057d8
# Selected candidate character color
HighlightCandidateColor=#7e62b9d8
# Highlight foreground color (input character color)
HighlightColor=#805057d8
# Input character background, no effect
HighlightBackgroundColor=#f1faff
# Candidate label color
CandidateLabelColor=#a99298d8
# Selected candidate label color
HighlightCandidateLabelColor=#a99298d9
# Candidate comment color
CandidateCommentColor=#a99298d8
# Selected candidate comment color
HighlightCandidateCommentColor=#a99298da
#
Spacing=3

[InputPanel/TextMargin]
# Candidate character distance from left side
Left=10
# Candidate character distance from right side
Right=10
# Candidate character distance from top
Top=6
# Candidate character distance from bottom
Bottom=6

[InputPanel/Background]
Color=#f1faff

[InputPanel/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Highlight]
Color=#dfe9f3

[InputPanel/Highlight/Margin]
# Highlight region left space
Left=10
# Highlight region right space
Right=10
# Highlight region top space
Top=7
# Highlight region bottom space
Bottom=7

[Menu]
Font=Sans 10
NormalColor=#805057
HighlightCandidateColor=#7e62b9
Spacing=3

[Menu/Background]
Color=#f1faff

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#dfe9f3

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
Color=#ffffff

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
