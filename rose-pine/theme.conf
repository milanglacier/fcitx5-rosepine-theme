# vim: ft=dosini
# Generated by scripts/generate.py from the Rosé Pine Squirrel schemes.
[Metadata]
Name=Rosé-Pine
Version=2
Author=scotabroad
Description=All natural pine, faux fur and a bit of soho vibes for the classy minimalist
ScaleWithDPI=True

[InputPanel]
Font=Sans 13
# Candidate text and preedit text
NormalColor=#e0def6da
# Selected candidate text
HighlightCandidateColor=#e0def6
# Highlighted preedit text
HighlightColor=#e0def6d8
# Highlighted preedit background
HighlightBackgroundColor=#1f1d2f
CandidateLabelColor=#6f6a88d8
HighlightCandidateLabelColor=#e0def6b2
CandidateCommentColor=#6f6a88
HighlightCandidateCommentColor=#6f6a88

[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

# Space around each candidate. The highlight margin must not exceed this, or
# the highlight overlaps the next candidate.
[InputPanel/TextMargin]
Left=6
Right=6
Top=4
Bottom=4

[InputPanel/Background]
Color=#1f1d2f

[InputPanel/Highlight]
Color=#fd6592d8

# Extends the highlight past the candidate text
[InputPanel/Highlight/Margin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
Font=Sans 10
NormalColor=#e0def6da
HighlightCandidateColor=#e0def6
Spacing=3

[Menu/Background]
Color=#1f1d2f

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#fd6592d8

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
Color=#6f6a88

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
